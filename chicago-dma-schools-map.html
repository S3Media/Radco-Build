<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Chicago DMA Schools — High &amp; Middle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101520;
    --ink-2:#1a2130;
    --line:#2b3446;
    --paper:#f2f4f7;
    --mute:#8d99ae;
    --hs:#1f5fd0;
    --ms:#d8342c;
    --panel-w:340px;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sans);
    background:var(--ink);
    color:var(--paper);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100%;width:100%}

  /* ---------- panel ---------- */
  #panel{
    width:var(--panel-w);
    flex:0 0 var(--panel-w);
    background:var(--ink);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
    z-index:1000;
  }
  .head{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0 0 8px;
  }
  h1{
    font-size:23px;
    line-height:1.12;
    font-weight:600;
    letter-spacing:-.02em;
    margin:0;
  }
  .total{
    font-family:var(--mono);
    font-size:12px;
    color:var(--mute);
    margin-top:8px;
  }

  /* ---------- legend / toggles ---------- */
  .legend{padding:14px 20px 4px;display:flex;flex-direction:column;gap:6px}
  .toggle{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:9px 11px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--paper);
    font-family:var(--sans);
    font-size:14px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s,background .15s,opacity .15s;
  }
  .toggle:hover{background:var(--ink-2)}
  .toggle:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
  .toggle[aria-pressed="false"]{opacity:.42}
  .dot{
    width:13px;height:13px;border-radius:50%;
    flex:0 0 13px;
    border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
  }
  .dot.hs{background:var(--hs)}
  .dot.ms{background:var(--ms)}
  .toggle .count{
    margin-left:auto;
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:500;
    color:var(--mute);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- search ---------- */
  .search-wrap{padding:12px 20px 12px}
  #county{
    width:100%;
    margin-bottom:8px;
    padding:9px 11px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--paper);
    font-family:var(--mono);
    font-size:12.5px;
    cursor:pointer;
  }
  #county:focus{outline:none;border-color:#4d7fd6}
  #search{
    width:100%;
    padding:10px 12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--paper);
    font-family:var(--sans);
    font-size:14px;
  }
  #search::placeholder{color:#69748a}
  #search:focus{outline:none;border-color:#4d7fd6}

  /* ---------- results ---------- */
  .list-head{
    padding:0 20px 8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mute);
  }
  #results{
    flex:1 1 auto;
    overflow-y:auto;
    padding:0 12px 12px;
    min-height:0;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  #results::-webkit-scrollbar{width:9px}
  #results::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    width:100%;
    padding:9px 8px;
    background:none;
    border:0;
    border-radius:6px;
    color:inherit;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
  }
  .row:hover{background:var(--ink-2)}
  .row:focus-visible{outline:2px solid #6ea8ff;outline-offset:-2px}
  .row .pip{
    width:9px;height:9px;border-radius:50%;
    flex:0 0 9px;margin-top:5px;
  }
  .row .nm{font-size:13.5px;line-height:1.3;font-weight:500}
  .row .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--mute);
    margin-top:2px;
    line-height:1.35;
  }
  .empty,.more{
    padding:14px 10px;
    font-size:12.5px;
    color:var(--mute);
    font-family:var(--mono);
    line-height:1.5;
  }
  .note{
    padding:11px 20px 14px;
    border-top:1px solid var(--line);
    font-size:11px;
    line-height:1.5;
    color:var(--mute);
  }

  /* ---------- map ---------- */
  #map{flex:1 1 auto;height:100%;background:#dfe3e8}
  .leaflet-container{font-family:var(--sans)}
  .leaflet-popup-content-wrapper{border-radius:8px;box-shadow:0 6px 24px rgba(16,21,32,.28)}
  .leaflet-popup-content{margin:13px 15px;line-height:1.45}
  .pop-type{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.15em;
    text-transform:uppercase;
    font-weight:600;
  }
  .pop-type.hs{color:var(--hs)}
  .pop-type.ms{color:var(--ms)}
  .pop-name{font-size:14.5px;font-weight:600;color:#101520;margin:4px 0 5px;letter-spacing:-.01em}
  .pop-addr{font-family:var(--mono);font-size:11.5px;color:#5b6577}
  .pop-link{
    display:inline-block;
    margin-top:8px;
    font-size:11.5px;
    font-weight:600;
    color:#1f5fd0;
    text-decoration:none;
    border-bottom:1px solid rgba(31,95,208,.35);
  }
  .pop-link:hover{border-bottom-color:#1f5fd0}

  /* ---------- mobile ---------- */
  #handle{display:none}
  @media (max-width:820px){
    #app{flex-direction:column-reverse}
    #panel{
      width:100%;flex:0 0 auto;
      max-height:52%;
      border-right:0;border-top:1px solid var(--line);
      border-radius:14px 14px 0 0;
      margin-top:-14px;
    }
    #panel.collapsed #results,
    #panel.collapsed .list-head,
    #panel.collapsed .note{display:none}
    #map{flex:1 1 auto;height:auto;min-height:0}
    #handle{
      display:block;width:100%;padding:7px 0 3px;
      background:none;border:0;cursor:pointer;
    }
    #handle span{display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
    .head{padding:6px 18px 13px}
    h1{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel" class="collapsed">
    <button id="handle" aria-label="Expand school list"><span></span></button>
    <div class="head">
      <p class="eyebrow">Chicago DMA · 1,673 schools</p>
      <h1>High &amp; middle schools</h1>

    </div>

      <button class="toggle" id="t-ms" aria-pressed="true">
        <span class="dot ms"></span> Middle schools <span class="count" id="c-ms"></span>
      </button>
    </div>

    <div class="search-wrap">
      <select id="county" aria-label="Filter by county">
        <option value="">All 11 Illinois DMA counties</option>
      </select>
      <input id="search" type="search" placeholder="Search name, city, or ZIP" autocomplete="off" aria-label="Search schools">
    </div>

    <p class="list-head" id="list-head">Results</p>
    <div id="results"></div>

    <p class="note">Cook, DeKalb, DuPage, Grundy, Kane, Kankakee, Kendall, Lake, LaSalle, McHenry, Will. The DMA\'s five Indiana counties aren\'t shown — the source sheet is Illinois only. Dots sit at ZIP&nbsp;code centers, fanned out where schools share a ZIP.</p>
  </aside>
  <div id="map"></div>
</div>

,"Woodstock North High School","3000 Raffel Rd","Woodstock","60098",42.32806,-88.43747,"McHenry"],[1,"Regl Inst Scholastic Excellence","11218 S Ridgeland","Worth","60482",41.6895,-87.7863,"Cook"],[0,"Worth Jr High School","11151 S New England","Worth","60482",41.68428,-87.78902,"Cook"],[0,"Cross Evangelical Lutheran School","8535 State Route 47","Yorkville","60560",41.6387,-88.4438,"Kendall"],[1,"Parkview Christian Academy","201 W Center St","Yorkville","60560",41.63348,-88.44652,"Kendall"],[1,"Yea Program","709 Game Farm Rd","Yorkville","60560",41.63317,-88.44266,"Kendall"],[1,"Yorkville High School","797 Game Farm Rd","Yorkville","60560",41.64374,-88.45279,"Kendall"],[0,"Yorkville Middle School","920 Prairie Crossing","Yorkville","60560",41.64114,-88.45456,"Kendall"],[1,"New Tech High - Zion-Benton East","1634 23rd St","Zion","60099",42.43898,-87.84165,"Lake"],[0,"Our Saviors Lutheran School","1800 23rd St","Zion","60099",42.44924,-87.84801,"Lake"],[1,"Roe Alternative Prog of Lake County","1620 23rd St","Zion","60099",42.44664,-87.84979,"Lake"],[0,"Zion Central Middle School","1716 27th St","Zion","60099",42.44374,-87.85027,"Lake"],[1,"Zion-Benton Twnshp High School","3901 21st St","Zion","60099",42.45022,-87.8261,"Lake"]];

const HS = '#1f5fd0', MS = '#d8342c';
const fmt = n => n.toLocaleString('en-US');

const map = L.map('map', {
  preferCanvas: true,
  zoomControl: false,
  minZoom: 7
}).setView([41.78, -88.0], 9);

L.control.zoom({ position: 'topright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const layerHS = L.layerGroup().addTo(map);
const layerMS = L.layerGroup().addTo(map);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const schools = DATA.map((d, i) => {
  const isHS = d[0] === 1;
  const m = L.circleMarker([d[5], d[6]], {
    radius: 4.5,
    color: '#ffffff',
    weight: 1,
    fillColor: isHS ? HS : MS,
    fillOpacity: .85,
    opacity: .9
  });
  const q = encodeURIComponent(`${d[1]}, ${d[2]}, ${d[3]}, IL ${d[4]}`);
  m.bindPopup(
    `<div class="pop-type ${isHS ? 'hs' : 'ms'}">${isHS ? 'High school' : 'Middle school'}</div>` +
    `<div class="pop-name">${esc(d[1])}</div>` +
    `<div class="pop-addr">${esc(d[2])}<br>${esc(d[3])}, IL ${esc(d[4])}<br>${esc(d[7])} County</div>` +
    `<a class="pop-link" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps</a>`
  );
  (isHS ? layerHS : layerMS).addLayer(m);
  return { i, isHS, name: d[1], addr: d[2], city: d[3], zip: d[4], lat: d[5], lng: d[6], county: d[7], m,
           key: (d[1] + ' ' + d[3] + ' ' + d[4] + ' ' + d[7]).toLowerCase() };
});

/* ---------- county dropdown ---------- */
const countyCounts = {};
schools.forEach(s => countyCounts[s.county] = (countyCounts[s.county] || 0) + 1);
Object.keys(countyCounts).sort((a, b) => countyCounts[b] - countyCounts[a]).forEach(c => {
  const o = document.createElement('option');
  o.value = c;
  o.textContent = `${c} — ${fmt(countyCounts[c])}`;
  document.getElementById('county').appendChild(o);
});

/* ---------- state ---------- */
const state = { hs: true, ms: true, q: '', county: '' };
const el = id => document.getElementById(id);
const results = el('results');

function matches(s) {
  if (s.isHS && !state.hs) return false;
  if (!s.isHS && !state.ms) return false;
  if (state.county && s.county !== state.county) return false;
  if (state.q && !s.key.includes(state.q)) return false;
  return true;
}

const CAP = 300;

function render() {
  const list = schools.filter(matches);
  const nHS = list.filter(s => s.isHS).length;
  el('c-hs').textContent = fmt(state.hs ? nHS : 0);
  el('c-ms').textContent = fmt(state.ms ? list.length - nHS : 0);
  const filtered = state.q || state.county;
  el('total').textContent = filtered
    ? `${fmt(list.length)} shown of 1,673`
    : '516 high · 1,157 middle';
  el('list-head').textContent = state.county && !state.q
    ? `${state.county} County, A–Z by city`
    : (state.q ? 'Results' : 'All schools, A–Z by city');

  results.innerHTML = '';
  if (!list.length) {
    results.innerHTML = '<p class="empty">No schools match. Try a city like “Naperville” or a ZIP like 60614.</p>';
    return;
  }
  const frag = document.createDocumentFragment();
  list.slice(0, CAP).forEach(s => {
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML =
      `<span class="pip" style="background:${s.isHS ? HS : MS}"></span>` +
      `<span><span class="nm">${esc(s.name)}</span>` +
      `<span class="sub">${esc(s.city)} · ${esc(s.zip)} · ${esc(s.county)}</span></span>`;
    b.addEventListener('click', () => {
      map.flyTo([s.lat, s.lng], 13, { duration: .7 });
      setTimeout(() => s.m.openPopup(), 720);
    });
    frag.appendChild(b);
  });
  if (list.length > CAP) {
    const p = document.createElement('p');
    p.className = 'more';
    p.textContent = `Showing first ${CAP} of ${fmt(list.length)} — keep typing to narrow it down.`;
    frag.appendChild(p);
  }
  results.appendChild(frag);
  results.scrollTop = 0;
}

/* ---------- controls ---------- */
function setLayer(which, on) {
  state[which] = on;
  el('t-' + which).setAttribute('aria-pressed', String(on));
  const layer = which === 'hs' ? layerHS : layerMS;
  if (on) map.addLayer(layer); else map.removeLayer(layer);
  render();
}
el('t-hs').addEventListener('click', () => setLayer('hs', !state.hs));
el('t-ms').addEventListener('click', () => setLayer('ms', !state.ms));

el('county').addEventListener('change', e => {
  state.county = e.target.value;
  render();
  const list = schools.filter(matches);
  if (state.county && list.length) {
    map.fitBounds(L.latLngBounds(list.map(s => [s.lat, s.lng])).pad(0.08));
  } else if (!state.county) {
    map.setView([41.78, -88.0], 9);
  }
});

let timer;
el('search').addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value.trim().toLowerCase();
  timer = setTimeout(() => { state.q = v; render(); }, 130);
});

const panel = el('panel');
el('handle').addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  el('handle').setAttribute('aria-label', panel.classList.contains('collapsed') ? 'Expand school list' : 'Collapse school list');
  setTimeout(() => map.invalidateSize(), 220);
});
el('search').addEventListener('focus', () => {
  if (window.innerWidth <= 820) panel.classList.remove('collapsed');
});

if (window.innerWidth > 820) panel.classList.remove('collapsed');
render();
</script>
